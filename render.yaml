databases:
  - name: kalorien-tracker-db
    plan: free
    databaseName: kalorien_tracker
    user: kalorien_tracker

services:
  - type: web
    name: kalorien-tracker-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate --accept-data-loss && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kalorien-tracker-db
          property: connectionString
      # Update this if the GitHub Pages URL ends up different (custom domain,
      # different repo/user name, ...).
      - key: CORS_ORIGIN
        value: https://fynn1506.github.io
      # Optional fallback food sources - fill in via the Render dashboard if
      # you have keys; leaving them empty just keeps those sources disabled.
      - key: USDA_FDC_API_KEY
        sync: false
      - key: FATSECRET_CLIENT_ID
        sync: false
      - key: FATSECRET_CLIENT_SECRET
        sync: false
